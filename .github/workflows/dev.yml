---
# yamllint disable rule:line-length
name: dev
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - .github/workflows/dev.yml
            - bin/install_boot.py
            - bin/install.py
            - build.gradle
            - data/**
            - dbmodel/**
            - docker-compose.yml
            - .env
            - extra/**
            - gradle.properties.in
            - gradle-wrapper.properties.in
            - make-loader.sh
            - project_build
            - settings.gradle
            - webapp/**

jobs:
    dev:
        runs-on: ubuntu-latest

        steps:
            - name: Install prerequisites
              run: |
                  set -euo pipefail
                  sudo apt-get -y install leiningen

            - name: Set up JDK 8
              uses: actions/setup-java@v5
              with:
                distribution: 'zulu'
                java-version: '8'

            - name: Checkout cadremine
              uses: actions/checkout@v6
              with:
                  path: "cadremine"

            - name: Checkout intermine
              uses: actions/checkout@v6
              with:
                  repository: "intermine/intermine"
                  ref: "eclipse-setup"
                  path: "intermine"

            - name: Checkout bluegenes
              uses: actions/checkout@v6
              with:
                  repository: "ucam-department-of-psychiatry/bluegenes"
                  ref: "sde-fixes"
                  path: "bluegenes"

            - name: Install
              run: |
                  set -euxo pipefail

                  cd /tmp
                  wget -O $OMOP_SCHEMA_FILE https://raw.githubusercontent.com/OHDSI/CommonDataModel/refs/heads/main/inst/csv/$OMOP_SCHEMA_FILE

                  mkdir $DOCKER_IMAGES_DIR
                  cd ${GITHUB_WORKSPACE}/bluegenes
                  npm install
                  lein uberjar
                  docker build -t $BLUEGENES_VERSION ${GITHUB_WORKSPACE}/bluegenes
                  docker save $BLUEGENES_VERSION $DOCKER_IMAGES_DIR/bluegenes.tar

                  export PGPASSWORD=postgres

                  export MINE_NAMES="main"
                  echo ${MINE_NAMES} > ${GITHUB_WORKSPACE}/cadremine/mines.txt

                  mkdir -p $VENV_DIR

                  # install_boot.py runs with system python, no third party dependencies
                  python3 ${GITHUB_WORKSPACE}/cadremine/bin/install_boot.py $VENV_DIR ${GITHUB_WORKSPACE}/intermine $DOCKER_IMAGES_DIR /tmp/$OMOP_SCHEMA_FILE ${GITHUB_WORKSPACE}/cadremine/test_data -v
              env:
                  # TODO: This is hardcoded in several places
                  BLUEGENES_VERSION: intermine/bluegenes:1.4.6-rc3
                  DOCKER_IMAGES_DIR: /tmp/docker_images
                  OMOP_SCHEMA_FILE: OMOP_CDMv5.4_Field_Level.csv
                  VENV_DIR: ${HOME}/.virtualenvs/cadremine

            - name: Dump Docker logs
              if: failure()
              run: |
                  set -euo pipefail
                  cd ${GITHUB_WORKSPACE}
                  sleep 120
                  compose_file1=${GITHUB_WORKSPACE}/cadremine/docker-compose.yml
                  compose_file2=${GITHUB_WORKSPACE}/cadremine/docker-compose-main.yml
                  docker compose -f ${compose_file1} -f ${compose_file2} logs bluegenes_main
                  docker compose -f ${compose_file1} -f ${compose_file2} logs nexus
                  docker compose -f ${compose_file1} -f ${compose_file2} logs postgres
                  docker compose -f ${compose_file1} -f ${compose_file2} logs solr
                  docker compose -f ${compose_file1} -f ${compose_file2} logs tomcat
