---
# yamllint disable rule:line-length
name: dev
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - .github/workflows/dev.yml
            - bin/install_boot.py
            - bin/install.py
            - build.gradle
            - data/**
            - dbmodel/**
            - docker-compose.yml
            - .env
            - extra/**
            - gradle.properties.in
            - gradle-wrapper.properties.in
            - make-loader.sh
            - project_build
            - settings.gradle
            - webapp/**

jobs:
    dev:
        runs-on: ubuntu-latest

        steps:
            - name: Install prerequisites
              run: |
                  set -euo pipefail
                  sudo apt-get -y install leiningen

            - name: Set up JDK 8
              uses: actions/setup-java@v5
              with:
                  distribution: 'zulu'
                  java-version: '8'

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 10

            - name: Checkout cadremine
              uses: actions/checkout@v6
              with:
                  path: "cadremine"

            - name: Checkout intermine
              uses: actions/checkout@v6
              with:
                  repository: "intermine/intermine"
                  ref: "items-xml-export-dev"
                  path: "intermine"

            - name: Checkout bluegenes
              uses: actions/checkout@v6
              with:
                  repository: "ucam-department-of-psychiatry/bluegenes"
                  ref: "sde-fixes"
                  path: "bluegenes"

            - name: Checkout im-tables-3
              uses: actions/checkout@v6
              with:
                  repository: "ucam-department-of-psychiatry/im-tables-3"
                  ref: "items-xml-option"
                  path: "im-tables-3"

            - name: Checkout CommonDataModel
              uses: actions/checkout@v6
              with:
                  repository: "OHDSI/CommonDataModel"
                  ref: "v5.4.1"
                  path: CommonDataModel

            - name: Build im-tables-3
              run: |
                  set -euxo pipefail
                  cd ${GITHUB_WORKSPACE}/im-tables-3
                  npm install
                  lein uberjar
                  mvn install:install-file -Dfile=${GITHUB_WORKSPACE}/im-tables-3/target/im-tables-0.16.0.jar -DartifactId=im-tables -Dversion=0.16.0 -DgroupId=org.intermine -Dpackaging=jar

            - name: Install
              run: |
                  set -euxo pipefail

                  export VENV_DIR=${HOME}/.virtualenvs
                  export DOCKER_IMAGES_DIR=${GITHUB_WORKSPACE}/cadremine/release_main/docker_images
                  export OMOP_SCHEMA_FILE=${GITHUB_WORKSPACE}/CommonDataModel/inst/csv/OMOP_CDMv5.4_Field_Level.csv
                  export BLUEGENES_VERSION=intermine/bluegenes:1.4.6-rc4

                  mkdir -p $DOCKER_IMAGES_DIR
                  cd ${GITHUB_WORKSPACE}/bluegenes
                  npm install
                  lein uberjar
                  docker build -t $BLUEGENES_VERSION ${GITHUB_WORKSPACE}/bluegenes
                  docker save $BLUEGENES_VERSION -o $DOCKER_IMAGES_DIR/bluegenes.tar

                  export PGPASSWORD=postgres

                  export MINE_NAMES="main"
                  echo ${MINE_NAMES} > ${GITHUB_WORKSPACE}/cadremine/mines.txt

                  mkdir -p $VENV_DIR

                  # install_boot.py runs with system python, no third party dependencies
                  python3 ${GITHUB_WORKSPACE}/cadremine/bin/install_boot.py $VENV_DIR/cadremine ${GITHUB_WORKSPACE}/intermine $DOCKER_IMAGES_DIR $OMOP_SCHEMA_FILE ${GITHUB_WORKSPACE}/cadremine/test_data -v
            - name: Dump stuff
              if: failure()
              run: |
                  set -euo pipefail

                  cd ${GITHUB_WORKSPACE}/cadremine

                  ls -l dbmodel
                  ls -l dbmodel/build
                  ls -l dbmodel/build/classes/java/main/org/intermine/model/bio
                  strings dbmodel/build/classes/java/main/org/intermine/model/bio/Person.class
                  ls -l dbmodel/build/gen
                  ls -l dbmodel/build/libs
                  ls -l dbmodel/build/resources
                  ls -l dbmodel/build/resources/main
                  ls -l dbmodel/build/tmp

                  echo "Dumping omop_additions.xml"
                  cat dbmodel/resources/omop_additions.xml

                  if [ -f project.xml ]; then
                      echo "Dumping project.xml"

                      cat project.xml
                  fi

                  sleep 120
                  compose_file1=${GITHUB_WORKSPACE}/cadremine/docker-compose.yml
                  compose_file2=${GITHUB_WORKSPACE}/cadremine/docker-compose-main.yml

                  if [ -f "${compose_file1}" ] && [ -f "${compose_file2}" ]; then
                      echo "Dumping Docker logs"
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs bluegenes_main
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs nexus
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs postgres
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs solr
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs tomcat
                  fi
