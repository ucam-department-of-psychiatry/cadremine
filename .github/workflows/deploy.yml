---
# yamllint disable rule:line-length
name: deploy
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - .github/workflows/deploy.yml
            - bin/initialise_nexus.py
            - bin/install_boot.py
            - bin/install.py
            - bin/release.py
            - build.gradle
            - data/**
            - dbmodel/**
            - docker-compose.yml
            - .env
            - extra/**
            - gradle.properties.in
            - gradle-wrapper.properties.in
            - make-loader.sh
            - postgres/**
            - project_build
            - settings.gradle
            - solr/**
            - tomcat/**
            - webapp/**

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Install prerequisites
              run: |
                  set -euo pipefail
                  sudo apt-get -y install dar wait-for-it leiningen

            - name: Dump versions
              run: |
                  set -euxo pipefail
                  node --version
                  npm --version

            - name: Set up JDK 8
              uses: actions/setup-java@v5
              with:
                distribution: 'zulu'
                java-version: '8'

            - name: Checkout cadremine
              uses: actions/checkout@v6
              with:
                  path: "cadremine"

            - name: Checkout intermine
              uses: actions/checkout@v6
              with:
                  repository: "intermine/intermine"
                  ref: "eclipse-setup"
                  path: "intermine"

            - name: Checkout bluegenes
              uses: actions/checkout@v6
              with:
                  repository: "ucam-department-of-psychiatry/bluegenes"
                  ref: "sde-fixes"
                  path: "bluegenes"

            - name: Checkout im-tables-3
              uses: actions/checkout@v6
              with:
                  repository: "ucam-department-of-psychiatry/im-tables-3"
                  ref: "items-xml-option"
                  path: "im-tables-3"

            - name: Build im-tables-3
              run: |
                  set -euxo pipefail
                  cd ${GITHUB_WORKSPACE}/im-tables-3
                  npm install
                  lein uberjar
                  mvn install:install-file -Dfile=${GITHUB_WORKSPACE}/im-tables-3/target/im-tables-0.16.0.jar -DartifactId=im-tables -Dversion=0.16.0 -DgroupId=org.intermine -Dpackaging=jar

            - name: Create virtualenv
              run: |
                  set -euxo pipefail
                  python3 -m venv ${HOME}/venv
                  PYTHON=${HOME}/venv/bin/python
                  ${PYTHON} -m pip install -r ${GITHUB_WORKSPACE}/cadremine/requirements.txt

            - name: Release
              run: |
                  set -euxo pipefail
                  # TODO: Also created in install.py but need to be in place when containers start
                  mkdir ${GITHUB_WORKSPACE}/cadremine/data/bluegenes_tools
                  mkdir ${GITHUB_WORKSPACE}/cadremine/data/nexus
                  mkdir ${GITHUB_WORKSPACE}/cadremine/data/postgres
                  mkdir ${GITHUB_WORKSPACE}/cadremine/data/solr
                  mkdir ${GITHUB_WORKSPACE}/cadremine/data/tomcat

                  PYTHON=${HOME}/venv/bin/python
                  ${PYTHON} ${GITHUB_WORKSPACE}/cadremine/bin/release.py ${GITHUB_WORKSPACE}/intermine ${GITHUB_WORKSPACE}/bluegenes main

            - name: Start Docker
              run: |
                  set -euxo pipefail
                  cd ${GITHUB_WORKSPACE}
                  compose_file=${GITHUB_WORKSPACE}/cadremine/docker-compose.yml
                  docker compose -f ${compose_file} up -d
                  # Wait for Nexus
                  wait-for-it localhost:8081

            - name: Populate Sonatype Nexus repository
              run: |
                  set -euxo pipefail
                  PYTHON=${HOME}/venv/bin/python
                  ${PYTHON} ${GITHUB_WORKSPACE}/cadremine/bin/initialise_nexus.py -v
                  python3 ${GITHUB_WORKSPACE}/cadremine/bin/download_maven_artifacts.py ${GITHUB_WORKSPACE}/intermine http://localhost:8081/repository/maven-public -v

            - name: Install
              run: |
                  set -euxo pipefail

                  cd /tmp
                  wget -O $OMOP_SCHEMA_FILE https://raw.githubusercontent.com/OHDSI/CommonDataModel/refs/heads/main/inst/csv/$OMOP_SCHEMA_FILE

                  export PGPASSWORD=postgres

                  export MINE_NAMES="main"
                  echo ${MINE_NAMES} > ${GITHUB_WORKSPACE}/cadremine/mines.txt

                  mkdir -p $VENV_DIR

                  # install_boot.py runs with system python, no third party dependencies
                  python3 ${GITHUB_WORKSPACE}/cadremine/bin/install_boot.py $VENV_DIR ${GITHUB_WORKSPACE}/intermine $DOCKER_IMAGES_DIR /tmp/$OMOP_SCHEMA_FILE ${GITHUB_WORKSPACE}/test_data -v --offline
              env:
                  DOCKER_IMAGES_DIR: ${GITHUB_WORKSPACE}/cadremine/release_main/docker_images
                  OMOP_SCHEMA_FILE: OMOP_CDMv5.4_Field_Level.csv
                  VENV_DIR: ${HOME}/.virtualenvs/cadremine

            - name: Dump logs
              if: failure()
              run: |
                  set -euo pipefail
                  cd ${GITHUB_WORKSPACE}
                  sleep 120

                  npm_logs_dir=${HOME}/.npm/_logs
                  if [ -d "${npm_logs_dir}" ]; then
                      echo "Dumping NPM logs"
                      find "${npm_logs_dir}" -maxdepth 1 -type f -exec cat {} \;
                  fi

                  compose_file1=${GITHUB_WORKSPACE}/cadremine/docker-compose.yml
                  compose_file2=${GITHUB_WORKSPACE}/cadremine/docker-compose-main.yml

                  if [ -f "${compose_file1}" ] && [ -f "${compose_file2}" ]; then
                      echo "Dumping Docker logs"
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs bluegenes_main
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs nexus
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs postgres
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs solr
                      docker compose -f "${compose_file1}" -f "${compose_file2}" logs tomcat
                  fi
