---
# yamllint disable rule:line-length
name: deploy
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - .github/workflows/deploy.yml
            - bin/deploy.py
            - bin/release.py
            - build.gradle
            - data/**
            - dbmodel/**
            - extra/**
            - gradle.properties.in
            - make-loader.sh
            - project_build
            - project.xml
            - settings.gradle
            - webapp/**

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Set up JDK 8
              uses: actions/setup-java@v1
              with:
                  java-version: '8'
            - name: Checkout cadremine
              uses: actions/checkout@v4
              with:
                  path: "cadremine"
            - name: Checkout intermine
              uses: actions/checkout@v4
              with:
                  repository: "intermine/intermine"
                  ref: "eclipse-setup"
                  path: "intermine"
            - name: Install intermine
              run: |
                  set -euxo pipefail
                  export PSQL_USER=test
                  export PSQL_PWD=test
                  export PSQL_HOST=localhost
                  python3 ${GITHUB_WORKSPACE}/intermine/config/lib/install_intermine.py

            - name: Release
              run: |
                  set -euxo pipefail
                  python3 ${GITHUB_WORKSPACE}/cadremine/bin/release.py ${GITHUB_WORKSPACE}/intermine
